[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-aml"
version = "0.1.0"
description = "Bitcoin AML graph analytics platform"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5,<6",
  "pandas>=2.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "loguru>=0.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]
