services:
  neo4j:
    image: neo4j:5.26-community
    container_name: btc-aml-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_server_memory_heap_max__size: 24G
      NEO4J_server_memory_pagecache_size: 32G
      NEO4J_dbms_memory_transaction_total_max: 8G

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: btc-aml-api
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # If you run the API inside Docker but llama.cpp runs on your host machine,
      # uncomment this line and make sure llama.cpp listens on 0.0.0.0:8080.
      # LLAMACPP_BASE_URL: http://host.docker.internal:8080

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: btc-aml-web
    environment:
      API_URL: http://api:8010
    ports:
      - "3000:3000"
    depends_on:
      - api

  monitor:
    build: .
    container_name: btc-aml-monitor
    command: >
      python -m btc_aml.cli monitor
      --interval ${MONITOR_INTERVAL:-600}
      --limit ${MONITOR_LIMIT:-10}
      --analytics-every ${ANALYTICS_EVERY:-100}
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - monitor

volumes:
  neo4j_data:
  neo4j_logs:
